# Uploads and deploys the site-shell Worker (shell/). A deploy also attaches its
# two routes from shell/wrangler.jsonc: akshayprabhakant.com/_site/* (the shared
# files) and the exact akshayprabhakant.com/ (the homepage, composed from GitHub
# Pages). No app binds it yet.
#
# - pull_request (this repo's branches): `wrangler versions upload` with a per-PR
#   alias. The version is NOT deployed; it answers only at its own Version URL,
#   https://pr-<n>-site-shell.<workers.dev subdomain>.workers.dev. Apps bound to
#   site-shell keep calling the deployed version. Until the Worker exists (the
#   first merge to main creates it) the PR run skips the upload and smoke test
#   with a notice.
# - push to main, or a manual run on main: `wrangler deploy`, live at
#   site-shell.<subdomain>.workers.dev, on the two routes, and to every app that
#   binds SHELL. Attaching the routes needs the token to edit Workers routes on
#   the akshayprabhakant.com zone. The run then checks, through the Cloudflare
#   API, that site-shell owns exactly those two routes.
#
# Uses the GitHub environment `production` (the place the app repos keep theirs):
# secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, and the variable
# WORKERS_DEV_SUBDOMAIN. Until both secrets exist the job reports a notice and
# skips everything after the check, and the run stays green; once they exist,
# run this workflow on main by hand (Actions → site-shell → Run workflow) to
# deploy without waiting for the next change. ci.yml builds and tests
# site-shell either way.
name: site-shell

on:
  pull_request:
    paths: ['src/**', 'shell/**', 'scripts/build-shell.ts', 'package.json', 'package-lock.json', '.github/workflows/site-shell.yml']
  push:
    branches: [main]
    paths: ['src/**', 'shell/**', 'scripts/build-shell.ts', 'package.json', 'package-lock.json', '.github/workflows/site-shell.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-shell-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fork:
    # A fork's pull request gets no deploy secrets: say so instead of failing.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - run: echo "::notice title=site-shell not uploaded::Pull requests from forks get no deploy secrets. ci.yml still builds and tests site-shell."

  upload:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      pull-requests: write # the PR run comments its Version URL
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKERS_DEV_SUBDOMAIN: ${{ vars.WORKERS_DEV_SUBDOMAIN }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check the deploy secrets and the target
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] && [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            msg="CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set in the production environment yet, so site-shell was not uploaded or deployed (ci.yml built and tested it). Once they are set, run this workflow on main to deploy."
            echo "::notice title=site-shell not uploaded::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error title=site-shell secrets incomplete::Only one of CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID is set in the production environment. Set both, or neither."
            exit 1
          fi
          if [ "$EVENT" != "pull_request" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error title=site-shell not deployed::Deploys run from main only; this run is on $GITHUB_REF."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.gate.outputs.ready == 'true'
        run: npm ci
      - name: Build, test, and refuse a stale committed build
        if: steps.gate.outputs.ready == 'true'
        run: |
          npm test
          if [ -n "$(git status --porcelain -- dist shell/generated shell/public)" ]; then
            echo "::error::The committed build is stale. Run 'npm run build' and commit dist/, shell/generated/ and shell/public/."
            exit 1
          fi

      - name: Check that the Worker exists (PR)
        # `wrangler versions upload` needs an existing Worker; the first merge to
        # main creates it with `wrangler deploy`.
        if: steps.gate.outputs.ready == 'true' && github.event_name == 'pull_request'
        id: worker
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/site-shell/settings")
          case "$status" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            404)
              msg="Worker site-shell does not exist yet, so no preview version was uploaded or smoke-tested (ci.yml built and tested it). The first merge to main creates it with wrangler deploy."
              echo "::notice title=site-shell preview skipped::$msg"
              echo "$msg" >> "$GITHUB_STEP_SUMMARY"
              echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Could not check whether Worker site-shell exists (Cloudflare API HTTP $status)"; exit 1 ;;
          esac

      - name: Upload a preview version (PR)
        if: steps.worker.outputs.exists == 'true'
        id: preview
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          out=$(npx wrangler versions upload -c shell/wrangler.jsonc \
            --preview-alias "pr-$PR" --tag "pr-$PR" --message "PR #$PR ${GITHUB_SHA::7}" 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          if [ -n "$WORKERS_DEV_SUBDOMAIN" ]; then
            url="https://pr-$PR-site-shell.$WORKERS_DEV_SUBDOMAIN.workers.dev"
          else
            url=$(printf '%s\n' "$out" | grep -oE 'https://[a-z0-9.-]+\.workers\.dev' | head -1)
          fi
          [ -n "$url" ] || { echo "::error::no Version URL: set WORKERS_DEV_SUBDOMAIN or check wrangler's output"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Deploy (main)
        if: steps.gate.outputs.ready == 'true' && github.event_name != 'pull_request'
        id: deploy
        run: |
          out=$(npx wrangler deploy -c shell/wrangler.jsonc --message "main ${GITHUB_SHA::7}" 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          if [ -n "$WORKERS_DEV_SUBDOMAIN" ]; then
            url="https://site-shell.$WORKERS_DEV_SUBDOMAIN.workers.dev"
          else
            url=$(printf '%s\n' "$out" | grep -oE 'https://site-shell\.[a-z0-9-]+\.workers\.dev' | head -1)
          fi
          [ -n "$url" ] || { echo "::error::no workers.dev URL: set WORKERS_DEV_SUBDOMAIN or check wrangler's output"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke-test what was uploaded
        if: steps.preview.outputs.url || steps.deploy.outputs.url
        env:
          URL: ${{ steps.preview.outputs.url || steps.deploy.outputs.url }}
        run: |
          # Only a version carrying this build has /_site/<id>/; until it is live the path is a 404.
          id=$(node -p "require('./shell/generated/build.json').id")
          for _ in 1 2 3 4 5 6; do
            if headers=$(curl -fsSI "$URL/_site/$id/site.js"); then
              printf '%s\n' "$headers" | grep -qi 'cache-control: public, max-age=31536000, immutable' \
                || { echo "::error::$URL/_site/$id/site.js is not served immutable"; exit 1; }
              echo "$URL serves build $id"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$URL does not serve /_site/$id/site.js"
          exit 1

      - name: Check the routes are attached (main)
        # Through the Cloudflare API, not the public site: the zone's bot
        # protection answers GitHub's runners with 403. Asserts that site-shell
        # owns exactly the routes shell/wrangler.jsonc lists (the exact / and
        # /_site/*) and nothing else. The token is sent only as a header.
        if: steps.deploy.outputs.url
        run: node build/scripts/check-routes.js shell/wrangler.jsonc

      - name: Comment the preview URL (PR)
        if: steps.preview.outputs.url
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.preview.outputs.url }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none \
            --body "site-shell preview version: $URL (uploaded, not deployed; apps keep calling the deployed version)"
