name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and unit tests (package, site-shell build, Worker typecheck)
        run: npm test
      - name: Contrast gate (report section 3.5.5 thresholds)
        run: npm run check:contrast
      - name: Committed dist/ and site-shell build match the catalogue
        run: |
          if [ -n "$(git status --porcelain -- dist shell/generated shell/public)" ]; then
            git status --short -- dist shell/generated shell/public
            git diff -- dist shell/generated shell/public
            echo "::error::dist/ or the site-shell build is stale. Run 'npm run build' and commit dist/, shell/generated/ and shell/public/."
            exit 1
          fi
      - name: site-shell harness (wrangler dev on local workerd; no Cloudflare account)
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          node shell/test-harness/make-fixtures.mjs
          npm run test:shell
      - name: site row and trail at 1440, 1280, 844x390 and 390x844 in both themes (headless Chrome)
        run: npm run test:row
      - name: theme picker in both themes (headless Chrome; chevron padding, open list, keyboard, pointer)
        run: npm run test:picker
      - name: Bundle site-shell exactly as a deploy would (nothing is uploaded)
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/site-shell" -c shell/wrangler.jsonc
